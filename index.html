<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plinko</title>
<style>
:root{--bg:#10152a;--panel:#19203a;--gold:#ffd166;--ink:#eef2ff;--muted:#9ba7c7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#29345e,var(--bg) 60%);color:var(--ink);font:15px system-ui,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(920px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:2px}button{border:0;border-radius:10px;padding:11px 16px;background:var(--gold);color:#342600;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.08)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--panel);padding:10px 14px;border-radius:10px;min-width:110px}.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.stat b{font-size:20px}.game{position:relative;margin-top:14px;background:rgba(10,14,30,.75);border:1px solid #3a4774;border-radius:16px;overflow:hidden;box-shadow:0 18px 55px #0007}.game canvas{display:block;width:100%;height:auto}.hint{color:var(--muted);text-align:center;margin:12px 0 0;font-size:13px}#message{color:var(--gold);font-weight:700;text-align:center;height:20px;margin-top:8px}
</style></head><body><main class="wrap"><header><h1>PLINKO</h1><button id="drop">DROP BALL</button></header><section class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Balls</small><b id="balls">10</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></section><div class="game"><canvas id="board" width="900" height="720" aria-label="Plinko game board"></canvas></div><div id="message">Click the board or press Space to drop a ball</div><p class="hint">Land in the center slots for the biggest multiplier. You have 10 balls per round.</p></main>
<script>
(()=>{const c=document.getElementById('board'),x=c.getContext('2d'),W=c.width,H=c.height;const scoreEl=document.getElementById('score'),ballsEl=document.getElementById('balls'),bestEl=document.getElementById('best'),msg=document.getElementById('message');let score=0,balls=10,best=+localStorage.plinkoBest||0,active=[],last=0;bestEl.textContent=best;
const rows=10,pegR=6,pegs=[];for(let r=0;r<rows;r++){let n=r+3,gap=64,start=(W-(n-1)*gap)/2;for(let i=0;i<n;i++)pegs.push({x:start+i*gap,y:105+r*45});}const slots=[.5,1,1.5,2,3,5,3,2,1.5,1,.5],slotW=W/slots.length;
function drop(){if(balls<=0){msg.textContent='Round over — press Reset to play again';return}balls--;ballsEl.textContent=balls;active.push({x:W/2+(Math.random()-.5)*14,y:34,vx:(Math.random()-.5)*1.4,vy:0,r:10,hue:Math.random()*360});msg.textContent='Good luck!';}
function reset(){score=0;balls=10;active=[];scoreEl.textContent=0;ballsEl.textContent=10;msg.textContent='New round — drop a ball!';}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#202b50');g.addColorStop(1,'#10162e');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#52618d';x.lineWidth=2;x.strokeRect(20,18,W-40,H-38);pegs.forEach(p=>{x.beginPath();x.fillStyle='#9aa8d2';x.shadowColor='#7ea3ff';x.shadowBlur=12;x.arc(p.x,p.y,pegR,0,7);x.fill();x.shadowBlur=0});for(let i=0;i<=slots.length;i++){x.fillStyle='#66749d';x.fillRect(i*slotW-2,H-125,4,105)}slots.forEach((v,i)=>{x.fillStyle=v>=3?'#ffd166':'#8d9ac2';x.font='bold 16px system-ui';x.textAlign='center';x.fillText('×'+v,i*slotW+slotW/2,H-75)});active.forEach(b=>{x.beginPath();x.fillStyle=`hsl(${b.hue} 90% 65%)`;x.shadowColor=x.fillStyle;x.shadowBlur=16;x.arc(b.x,b.y,b.r,0,7);x.fill();x.shadowBlur=0});}
function tick(t){let dt=Math.min((t-last)/16.67||1,2);last=t;active.forEach(b=>{b.vy+=.22*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;pegs.forEach(p=>{let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),min=b.r+pegR;if(d<min){let nx=dx/d||0;b.x=p.x+nx*min;b.vx+=nx*(1.8+Math.random()*1.4);b.vy*=.72;}});if(b.x<30||b.x>W-30)b.vx*=-.7;if(b.y>H-142){let i=Math.max(0,Math.min(slots.length-1,Math.floor(b.x/slotW)));score+=slots[i];scoreEl.textContent=score;best=Math.max(best,score);bestEl.textContent=best;localStorage.plinkoBest=best;b.done=true;msg.textContent=`Landed on ×${slots[i]}!`;}});active=active.filter(b=>!b.done);draw();requestAnimationFrame(tick)}document.getElementById('drop').onclick=drop;c.onclick=drop;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop()}if(e.key.toLowerCase()==='r')reset()});let rb=document.createElement('button');rb.textContent='RESET';rb.onclick=reset;document.querySelector('header').append(rb);requestAnimationFrame(tick)})();
</script></body></html>
