<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plinko</title>
<style>
:root{--bg:#10152a;--panel:#19203a;--gold:#ffd166;--ink:#eef2ff;--muted:#9ba7c7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#29345e,var(--bg) 62%);color:var(--ink);font:15px system-ui,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(920px,100%)}header{display:flex;align-items:center;gap:10px;margin-bottom:12px}h1{margin:0 auto 0 0;letter-spacing:3px;font-size:clamp(28px,5vw,44px)}button{border:0;border-radius:10px;padding:11px 16px;background:var(--gold);color:#342600;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.1)}button:active{transform:translateY(1px)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--panel);padding:9px 15px;border-radius:10px;min-width:105px}.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.stat b{font-size:20px}.game{margin-top:14px;background:#0b1025;border:1px solid #44527e;border-radius:16px;overflow:hidden;box-shadow:0 18px 55px #0008}.game canvas{display:block;width:100%;height:auto;cursor:crosshair}.message{text-align:center;color:var(--gold);font-weight:700;height:22px;margin-top:8px}.hint{text-align:center;color:var(--muted);font-size:13px;margin:4px 0}
</style></head><body><main class="wrap"><header><h1>PLINKO</h1><button id="drop" type="button">DROP BALL</button><button id="reset" type="button">RESET</button></header><section class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Balls</small><b id="balls">10</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></section><div class="game"><canvas id="board" width="900" height="720"></canvas></div><div id="message" class="message">Click the board or press Space to drop a ball</div><p class="hint">The center bucket pays ×5. Press R to reset.</p></main>
<script>
'use strict';
(()=>{
 const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
 const scoreNode=document.getElementById('score'),ballsNode=document.getElementById('balls'),bestNode=document.getElementById('best'),message=document.getElementById('message');
 const pegs=[],balls=[];const multipliers=[.5,1,1.5,2,3,5,3,2,1.5,1,.5];const slotW=W/multipliers.length;let score=0,remaining=10,best=Number(localStorage.getItem('plinkoBest')||0),last=0;
 bestNode.textContent=best;
 // A true pyramid: each row has one more peg and is horizontally centered.
 const rowCount=10,gapX=72,gapY=48,topY=104;
 for(let row=0;row<rowCount;row++){const count=row+1;const left=W/2-(row*gapX)/2;for(let col=0;col<count;col++)pegs.push({x:left+col*gapX,y:topY+row*gapY,r:7});}
 function setMessage(text){message.textContent=text}
 function drop(){if(remaining<=0){setMessage('Round over — press RESET to play again');return}remaining--;balls.push({x:W/2+(Math.random()-.5)*12,y:34,vx:(Math.random()-.5)*1.5,vy:0,r:10,color:`hsl(${Math.random()*360} 90% 65%)`});ballsNode.textContent=remaining;setMessage('Ball in play!')}
 function reset(){score=0;remaining=10;balls.length=0;scoreNode.textContent='0';ballsNode.textContent='10';setMessage('New round — drop a ball!')}
 function draw(){const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#202b50');gradient.addColorStop(1,'#10162e');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#52618d';ctx.lineWidth=2;ctx.strokeRect(18,18,W-36,H-36);
  pegs.forEach(p=>{ctx.beginPath();ctx.fillStyle='#d5defc';ctx.shadowColor='#7ea3ff';ctx.shadowBlur=12;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});
  const bucketTop=H-132;for(let i=0;i<=multipliers.length;i++){ctx.fillStyle='#66749d';ctx.fillRect(i*slotW-2,bucketTop,4,112)}multipliers.forEach((m,i)=>{ctx.fillStyle=m>=3?'#ffd166':'#aeb9df';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('×'+m,i*slotW+slotW/2,H-75)});
  balls.forEach(b=>{ctx.beginPath();ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=16;ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
 }
 function physics(time){const dt=Math.min((time-last)/16.666||1,2);last=time;for(const b of balls){b.vy+=.24*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
   for(const p of pegs){let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),min=b.r+p.r;if(d<min){const nx=(dx/d)||0,ny=(dy/d)||-1;b.x=p.x+nx*min;b.y=p.y+ny*min;const toward=b.vx*nx+b.vy*ny;b.vx-=1.8*toward*nx;b.vy-=1.8*toward*ny;b.vx+=nx*1.4;b.vy*=.72}}
   if(b.x<b.r+22){b.x=b.r+22;b.vx=Math.abs(b.vx)*.75}if(b.x>W-b.r-22){b.x=W-b.r-22;b.vx=-Math.abs(b.vx)*.75}
   if(b.y>H-145){const index=Math.max(0,Math.min(multipliers.length-1,Math.floor(b.x/slotW)));score+=multipliers[index];scoreNode.textContent=score;best=Math.max(best,score);bestNode.textContent=best;localStorage.setItem('plinkoBest',best);b.remove=true;setMessage(`Landed on ×${multipliers[index]}!`)}
  }for(let i=balls.length-1;i>=0;i--)if(balls[i].remove)balls.splice(i,1);draw();requestAnimationFrame(physics)}
 document.getElementById('drop').addEventListener('click',drop);document.getElementById('reset').addEventListener('click',reset);canvas.addEventListener('click',drop);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop()}else if(e.key.toLowerCase()==='r')reset()});draw();requestAnimationFrame(physics);
})();
</script></body></html>
